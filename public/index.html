<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socket.IO Example</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <h1>Socket.IO Example</h1>
  <input type="text" id="userId" placeholder="Enter user ID">
  <button onclick="connect()">Connect</button>
  <br><br>
  <input type="text" id="message" placeholder="Enter message">
  <button onclick="sendMessage()">Send Message</button>
  <br><br>
  <div id="messages"></div>

  <script>
    let socket;

    const connect = () => {
      const userId = document.getElementById('userId').value;
      if (userId) {
        socket = io();
        socket.emit('register', userId);

        socket.on('message', (data) => {
          const messagesDiv = document.getElementById('messages');
          const newMessage = document.createElement('div');
          newMessage.textContent = `${data.type}: ${data.message}`;
          messagesDiv.appendChild(newMessage);
        });
      }
    };

    const sendMessage = () => {
      const userId = document.getElementById('userId').value;
      const message = document.getElementById('message').value;
      if (userId && message) {
        axios.post('/api-utils/comment', 
          {
            "body": message,
            "post_id": 120,
            "type": "blog"
          },
          {
            headers: { 
              'Content-Type': 'application/json',
              'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJodHRwczovL2FwaS5iYWxsb2cuc3RvcmUiLCJzdWIiOiJ0ZXN0NCIsImlhdCI6MTcyMzU1Njg1NywiZXhwIjoxNzIzNTY0MDU3fQ.9QaddvW6Mjo8pM1fn1of6S7styx-yxEevtdWyTaLh8A' // 예시로 Authorization 헤더 추가
            }
          }
        )
        .then(response => {
          console.log('Message sent successfully:', response.data);
        })
        .catch(error => {
          console.error('Error sending message:', error);
        });
        socket.emit("send_message", { user_id: userId, message });
      }
    };

    window.connect = connect;
    window.sendMessage = sendMessage;
  </script>
</body>
</html>
