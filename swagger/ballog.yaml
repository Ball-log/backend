swagger: "2.0"
info:
  description: "API Documentation"
  version: "1.0.0"
  title: "API"
host: "api.example.com"
basePath: "/v1"
schemes:
  - "http"
paths:
  /auth/login/{sns}:
    security:
    get:
      tags:
        - "auth"
      summary: "소셜 네트워크 로그인"
      parameters:
        - name: "sns"
          in: "path"
          required: true
          type: "string"
      responses:
        "200":
          description: "OK"
        "302":
          description: "Redirect to the external authentication provider"
          headers:
            Location:
              description: "The URL to redirect to for social network login"
              schema:
                type: "string"
                example: "http://localhost:3000/auth/login/google/redirect?code=4/0AcvDMrDFSLpKYCNEA3xdwNYPURCs9RqTdP2LQLerg1r8LxjrgxPjjBb8Juuh5cmDrT95mA"
  /auth/login/test:
    post:
      tags:
        - "auth"
      summary: "소셜 네트워크 로그인 테스트"
      description: |
        토큰을 발급받기 위한 테스터용 API입니다. id는 test1 ~ test4까지 입니다. 원하는 테스트 아이디를 입력해 토큰 정보를 받으시면 됩니다. 받으신 Authorization과 RefreshToken을 상단 우측 Authorize에 삽입하시면 헤더에 토큰 정보가 유지됩니다.
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            type: "object"
            properties:
              id:
                type: "string"
                example: "test1"
      responses:
        "200":
          description: "OK"
  /auth/refreshToken:
    post:
      security:
        - Authorization: []
          RefreshToken: []
      tags:
        - "auth"
      summary: "엑세스 토큰 재발급"
      responses:
        "500":
          description: "헤더에 토큰이 없음"
          schema:
            type: "string"
            example: "Error: there is no token."
        "400":
          description: "아직 사용 가능한 엑세스 토큰"
          schema:
            type: "string"
            example: "Error: access token is valid"
  /auth/signUp/{sns}:
    get:
      tags:
        - "auth"
      summary: "소셜 네트워크 회원가입"
      parameters:
        - name: "sns"
          in: "path"
          required: true
          type: "string"
      responses:
        "200":
          description: "OK"

  /auth/signUp/setting:
    get:
      security:
        - Authorization: []
      tags:
        - "auth"
      summary: "회원 아이콘 및 이름 조회"
      responses:
        "200":
          description: "OK"
          schema:
            type: "object"
            properties:
              isSuccess:
                type: "boolean"
                example: true
              code:
                type: "string"
                example: "200"
              message:
                type: "string"
                example: "SUCCESS!"
              result:
                type: "object"
                properties:
                  user_id:
                    type: "string"
                    example: "google00000000000"
                  user_icon:
                    type: "string"
                    example: "https://example.com/icon.jpg"
                  user_name:
                    type: "string"
                    example: "John Doe"
                  team_info:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        team_id:
                          type: "integer"
                          example: 1
                        team_name:
                          type: "string"
                          example: "삼성"
                        team_icon_flag:
                          type: "string"
                          example: "flag_samsung.png"
                    example:
                      - team_id: 1
                        team_name: "삼성"
                        team_icon_flag: "flag_samsung.png"
                      - team_id: 2
                        team_name: "LG"
                        team_icon_flag: "flag_lg.png"
                      - team_id: 3
                        team_name: "SK"
                        team_icon_flag: "flag_sk.png"

    patch:
      security:
        - Authorization: []
      tags:
        - "auth"
      summary: "회원 아이콘, 이름 및 팀 설정"
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            type: "object"
            properties:
              user_icon:
                type: "string"
                example: "https://example.com/icon.jpg"
              user_team_id:
                type: "integer"
                example: 1
      responses:
        "200":
          description: "OK"
          schema:
            type: "object"
            properties:
              isSuccess:
                type: "boolean"
                example: true
              code:
                type: "string"
                example: "200"
              message:
                type: "string"
                example: "SUCCESS!"
              result: 
                type: "string"
                example: "NULL"

  /blog/posts/{postId}/comments:
    post:
      security:
        - Authorization: []
      tags:
        - "blog"
      summary: "블로그 댓글 작성"
      parameters:
        - name: "postId"
          in: "path"
          required: true
          type: "integer"
        - in: "body"
          name: "body"
          required: true
          schema:
            type: "object"
            properties:
              postId:
                type: "integer"
              body:
                type: "string"
      responses:
        "201":
          description: "댓글 작성 성공"

  /blog/posts/{postId}/comments/{commentId}/replies:
    post:
      security:
        - Authorization: []
      tags:
        - "blog"
      summary: "블로그 대댓글 작성"
      parameters:
        - name: "postId"
          in: "path"
          required: true
          type: "integer"
        - name: "commentId"
          in: "path"
          required: true
          type: "integer"
        - in: "body"
          name: "body"
          required: true
          schema:
            type: "object"
            properties:
              postId:
                type: "integer"
              body:
                type: "string"
      responses:
        "201":
          description: "대댓글 작성 성공"

  /blog/posts/{postId}/like:
    post:
      security:
        - Authorization: []
      tags:
        - "blog"
      summary: "블로그 좋아요 토글"
      parameters:
        - name: "postId"
          in: "path"
          required: true
          type: "integer"
      responses:
        "200":
          description: "좋아요 성공"
          schema:
            type: "object"
            properties:
              isSuccess:
                type: "boolean"
              code:
                type: "string"
              message:
                type: "string"
              result:
                type: "object"
                properties:
                  like:
                    type: "boolean"

  /blog/posts/{postId}:
    delete:
      security:
        - Authorization: []
      tags:
        - "blog"
      summary: "블로그 글 삭제"
      parameters:
        - name: "postId"
          in: "path"
          required: true
          type: "integer"
      responses:
        "200":
          description: "글 삭제 성공"

    put:
      security:
        - Authorization: []
      tags:
        - "blog"
      summary: "블로그 글 수정"
      parameters:
        - name: "postId"
          in: "path"
          required: true
          type: "integer"
        - in: "body"
          name: "body"
          required: true
          schema:
            type: "object"
            properties:
              title:
                type: "string"
              gameDate:
                type: "string"
              teams:
                type: "object"
                properties:
                  Team1:
                    type: "string"
                  Team2:
                    type: "string"
              score:
                type: "object"
                properties:
                  Team1Score:
                    type: "integer"
                  Team2Score:
                    type: "integer"
              content:
                type: "string"
              authorName:
                type: "string"
      responses:
        "200":
          description: "글 수정 성공"

  /blog/posts/articles:
    get:
      security:
        - Authorization: []
      tags:
        - "blog"
      summary: "블로그 글 목록 조회"
      responses:
        "200":
          description: "목록 조회 성공"
          schema:
            type: "object"
            properties:
              isSuccess:
                type: "boolean"
              code:
                type: "string"
              message:
                type: "string"
              result:
                type: "array"
                items:
                  type: "object"
                  properties:
                    postId:
                      type: "integer"
                    title:
                      type: "string"
                    gameDate:
                      type: "string"
                    teams:
                      type: "object"
                      properties:
                        Team1:
                          type: "string"
                        Team2:
                          type: "string"
                    score:
                      type: "object"
                      properties:
                        Team1Score:
                          type: "integer"
                        Team2Score:
                          type: "integer"
                    content:
                      type: "string"
                    authorName:
                      type: "string"
                    likeCount:
                      type: "integer"
                    createdAt:
                      type: "string"

    post:
      security:
        - Authorization: []
      tags:
        - "blog"
      summary: "블로그 글 작성"
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            type: "object"
            properties:
              title:
                type: "string"
              gameDate:
                type: "string"
              teams:
                type: "object"
                properties:
                  Team1:
                    type: "string"
                  Team2:
                    type: "string"
              score:
                type: "object"
                properties:
                  Team1Score:
                    type: "integer"
                  Team2Score:
                    type: "integer"
              content:
                type: "string"
              authorName:
                type: "string"
      responses:
        "201":
          description: "글 작성 성공"

  /community/comment:
    post:
      security:
        - Authorization: []
      tags:
        - "community"
      summary: "커뮤니티 댓글 작성"
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            type: "object"
            properties:
              postId:
                type: "integer"
              body:
                type: "string"
      responses:
        "200":
          description: "댓글 작성 성공"
          schema:
            type: "object"
            properties:
              isSuccess:
                type: "boolean"
              code:
                type: "string"
              message:
                type: "string"
              result:
                type: "object"

  /community/like/{post_id}:
    patch:
      security:
        - Authorization: []
      tags:
        - "community"
      summary: "커뮤니티 좋아요 토글"
      parameters:
        - name: "post_id"
          in: "path"
          required: true
          type: "integer"
      responses:
        "200":
          description: "좋아요 성공"
          schema:
            type: "object"
            properties:
              isSuccess:
                type: "boolean"
              code:
                type: "string"
              message:
                type: "string"
              result:
                type: "object"
                properties:
                  like:
                    type: "boolean"

  /community/post:
    post:
      security:
        - Authorization: []
      tags:
        - "community"
      summary: "커뮤니티 글 작성"
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            type: "object"
            properties:
              title:
                type: "string"
              content:
                type: "string"
              imageUrls:
                type: "array"
                items:
                  type: "string"
              type:
                type: "string"
                example: "team 또는 league"
      responses:
        "200":
          description: "글 작성 성공"
          schema:
            type: "object"
            properties:
              isSuccess:
                type: "boolean"
              code:
                type: "string"
              message:
                type: "string"
              result:
                type: "object"

  /community/post/{post_id}:
    get:
      security:
        - Authorization: []
      tags:
        - "community"
      summary: "커뮤니티 글 상세 조회"
      parameters:
        - name: "post_id"
          in: "path"
          required: true
          type: "integer"
      responses:
        "200":
          description: "글 조회 성공"
          schema:
            type: "object"
            properties:
              isSuccess:
                type: "boolean"
                example: true
              code:
                type: "string"
                example: "200"
              message:
                type: "string"
                example: "success!"
              result:
                type: "object"
                properties:
                  postId:
                    type: "integer"
                    example: 7
                  title:
                    type: "string"
                    example: "123"
                  authorId:
                    type: "string"
                    example: "google107022130803262620129"
                  authorName:
                    type: "string"
                    example: "현우"
                  authorProfileUrl:
                    type: "string"
                    nullable: true
                    example: null
                  date:
                    type: "string"
                    format: "date-time"
                    example: "2024-07-27T02:32:12.000Z"
                  likeCount:
                    type: "integer"
                    example: 1
                  commentCount:
                    type: "integer"
                    example: 3
                  imageUrl:
                    type: "array"
                    items:
                      type: "string"
                    example: []
                  isMine:
                    type: "boolean"
                    example: true
                  comments:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        commentId:
                          type: "integer"
                          example: 1
                        comment:
                          type: "string"
                          example: "zzz good"
                        authorId:
                          type: "string"
                          example: "naver6E5PtxWLMHHdEKeZUptmD6F53J63qJtjLb7pStMfFQU"
                        authorName:
                          type: "string"
                          example: "김성준"
                        date:
                          type: "string"
                          format: "date-time"
                          example: "2024-07-27T02:58:48.000Z"
                        isMine:
                          type: "boolean"
                          example: false
                        replies:
                          type: "array"
                          items:
                            type: "object"
                            properties:
                              replyId:
                                type: "integer"
                                example: 1
                              commentId:
                                type: "integer"
                                example: 1
                              comment:
                                type: "string"
                                example: "thx!"
                              authorId:
                                type: "string"
                                example: "google107022130803262620129"
                              authorName:
                                type: "string"
                                example: "현우"
                              date:
                                type: "string"
                                format: "date-time"
                                example: "2024-07-27T02:59:07.000Z"
                              isMine:
                                type: "boolean"
                                example: true

    patch:
      security:
        - Authorization: []
      tags:
        - "community"
      summary: "커뮤니티 글 수정"
      parameters:
        - name: "post_id"
          in: "path"
          required: true
          type: "integer"
        - in: "body"
          name: "body"
          required: true
          schema:
            type: "object"
            properties:
              title:
                type: "string"
              content:
                type: "string"
              deleteImageIds:
                type: "array"
                items:
                  type: "integer"
                  example: 7
              newImageUrls:
                type: "array"
                items:
                  type: "string"
                  example: "string"
      responses:
        "200":
          description: "글 수정 성공"
          schema:
            type: "object"
            properties:
              isSuccess:
                type: "boolean"
              code:
                type: "string"
              message:
                type: "string"
              result:
                type: "object"

    delete:
      security:
        - Authorization: []
      tags:
        - "community"
      summary: "커뮤니티 글 삭제"
      parameters:
        - name: "post_id"
          in: "path"
          required: true
          type: "integer"
      responses:
        "200":
          description: "글 삭제 성공"
          schema:
            type: "object"
            properties:
              isSuccess:
                type: "boolean"
              code:
                type: "string"
              message:
                type: "string"
              result:
                type: "object"

  /community/posts:
    get:
      security:
        - Authorization: []
      tags:
        - "community"
      summary: "커뮤니티 글 목록 조회"
      parameters:
        - name: "type"
          in: "path"
          required: true
          type: "string"
          description: "리그 커뮤니티 or 마이팀 커뮤니티 'team' or 'league'."
          enum:
            - "team"
            - "league"
        - name: "cursor"
          in: "path"
          required: false
          type: "integer"
          description: "마지막으로 조회한 글의 ID. 첫번째 조회인 경우엔 보내지 말아주세요."
        - name: "page"
          in: "path"
          required: true
          type: "integer"
          description: "페이징 할 단위"
      responses:
        "200":
          description: "목록 조회 성공"
          schema:
            type: "object"
            properties:
              isSuccess:
                type: "boolean"
              code:
                type: "string"
              message:
                type: "string"
              result:
                type: "object"
                properties:
                  totalCount:
                    type: "integer"
                  data:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        postId:
                          type: "integer"
                        title:
                          type: "string"
                        authorName:
                          type: "string"
                        date:
                          type: "string"
                          example: "2024-07-27T02:32:12.000Z"
                        likeCount:
                          type: "integer"
                        commentCount:
                          type: "integer"
                        imageUrls:
                          type: "array"
                          items:
                            type: "string"

  /community/reply:
    post:
      security:
        - Authorization: []
      tags:
        - "community"
      summary: "커뮤니티 대댓글 작성"
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            type: "object"
            properties:
              postId:
                type: "integer"
              commentId:
                type: "integer"
              body:
                type: "string"

      responses:
        "200":
          description: "대댓글 작성 성공"
          schema:
            type: "object"
            properties:
              isSuccess:
                type: "boolean"
              code:
                type: "string"
              message:
                type: "string"
              result:
                type: "object"

  /myPage:
    get:
      security:
        - Authorization: []
      tags:
        - "myPage"
      summary: "마이페이지 조회"
      responses:
        "200":
          description: "마이페이지 조회 성공"
          schema:
            type: "object"
            properties:
              isSuccess:
                type: "boolean"
                example: true
              code:
                type: "string"
                example: "200"
              message:
                type: "string"
                example: "SUCCESS"
              result:
                type: "object"
                properties:
                  team_id:
                    type: "string"
                    example: "1"
                  team_icon_round:
                    type: "string"
                    example: "https://example.com/icon.jpg"
                  user_background_img:
                    type: "string"
                    example: "https://example.com/icon.jpg"
                  user_name:
                    type: "string"
                    example: "user name"
                  match_date:
                    type: "string"
                  user_team_icon_flag:
                    type: "string"
                    example: "https://example.com/icon.jpg"
                  opposition_icon_flag:
                    type: "string"
                    example: "https://example.com/icon.jpg"
                  user_team_score:
                    type: "integer"
                    example: 5
                  opposition_score:
                    type: "integer"
                    example: 3
                  writed_date_list:
                    type: "array"
                    items:
                      type: "string"
                    example:
                      - "2024-01-15"
                      - "2024-02-03"
                      - "2024-03-20"
                      - "2024-04-07"
                      - "2024-05-22"

  /myPage/post:
    get:
      security:
        - Authorization: []
      tags:
        - "myPage"
      summary: "마이페이지 날짜별 작성글 조회"
      parameters:
        - name: "date"
          in: "query"
          required: true
          type: "string"
      responses:
        "200":
          description: "목록 조회 성공"
          schema:
            type: "object"
            properties:
              isSuccess:
                type: "boolean"
                example: true
              code:
                type: "string"
                example: "200"
              message:
                type: "string"
                example: "SUCCESS!"
              result:
                type: "object"
                properties:
                  blog_list:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        blog_id:
                          type: "integer"
                        blog_thumbnail:
                          type: "string"
                        blog_title:
                          type: "string"
                        blog_created_at:
                          type: "string"
                        blog_count_like:
                          type: "integer"
                        blog_count_comment:
                          type: "integer"
                    example:
                      - blog_id: 1
                        blog_thumbnail: "https://example.com/thumbnail.jpg"
                        blog_title: "Blog Title 1"
                        blog_created_at: "2024-07-30"
                        blog_count_like: 10
                        blog_count_comment: 5
                      - blog_id: 5
                        blog_thumbnail: "https://example.com/thumbnail.jpg"
                        blog_title: "Blog Title 4"
                        blog_created_at: "2024-07-30"
                        blog_count_like: 11
                        blog_count_comment: 6
                  mvp_list:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        mvp_id:
                          type: "integer"
                        mvp_thumbnail:
                          type: "string"
                        mvp_player_name:
                          type: "string"
                        mvp_player_record:
                          type: "string"
                        mvp_created_at:
                          type: "string"
                        mvp_count_like:
                          type: "integer"
                        mvp_count_comment:
                          type: "integer"
                    example:
                      - mvp_id: 2
                        mvp_thumbnail: "https://example.com/thumbnail.jpg"
                        mvp_player_name: "Player Name 1"
                        mvp_player_record: "3rd"
                        mvp_created_at: "2024-07-30"
                        mvp_count_like: 8
                        mvp_count_comment: 4
                      - mvp_id: 6
                        mvp_thumbnail: "https://example.com/thumbnail.jpg"
                        mvp_player_name: "Player Name 2"
                        mvp_player_record: "3rd"
                        mvp_created_at: "2024-07-30"
                        mvp_count_like: 8
                        mvp_count_comment: 4

                    

  /myPage/setting/backgroundImg:
    patch:
      security:
        - Authorization: []
      tags:
        - "myPage"
