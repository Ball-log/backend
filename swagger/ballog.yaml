/api-utils/s3:
    post:
      security:
        - Authorization: []
      tags:
        - "api-utils"
      summary: "s3 presigned url 호출"
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            type: "object"
            properties:
              fileName:
                type: "string"
                example: "exampleIcon.jpg"
              fileLocation:
                type: string
                enum:
                  -icon
                  -background
                  -player
                  -post
                example: "icon"
              fileType:
                type: string
                example: "image/jpeg"
              reqType:
                type: string
                enum:
                  -put
                  -delete
                example: "put"
      responses:
        "200":
          description: "s3 presigned url 호출"
          schema:
            type: "object"
            properties:
              isSuccess:
                type: "boolean"
                example: true
              code:
                type: "string"
                example: "200"
              message:
                type: "string"
                example: "SUCCESS!"
              result:
                type: "object"
                properties:
                  presignedUrl:
                    type: "string"
                    example: "http://example.com"

securityDefinitions:
  Authorization:
    type: apiKey
    name: Authorization
    in: header
  RefreshToken:
    type: apiKey
    name: RefreshToken
    in: header
  oauth2:
    type: oauth2
    authorizationUrl: https://accounts.google.com/o/oauth2/auth
    tokenUrl: https://oauth2.googleapis.com/token
    flow: accessCode
    scopes:
      read: Grants read access
      write: Grants write access
      admin: Grants access to admin operations